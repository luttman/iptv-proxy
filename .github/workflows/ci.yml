name: CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.64.8
        # golangci-lint refuses to run if the Go version it was *built*
        # with is older than this module's go.mod directive. Prebuilt
        # release binaries lag behind brand-new Go releases, so build
        # from source with the toolchain setup-go just installed
        # instead of downloading a binary that may be stale.
        install-mode: goinstall
    - name: Run tests and attempt building
      run: |
        export PATH=$(go env GOPATH)/bin:$PATH
        go test -mod vendor -v -race ./...
        go build -mod vendor
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag iptv-proxy:ci-build
