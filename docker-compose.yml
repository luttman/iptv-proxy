version: "3"
services:
  iptv-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # SQLite database holding users and xtream-code backends.
      # Mounted as a directory so the file survives container recreation.
      - ./data:/data
    container_name: "iptv-proxy"
    restart: on-failure
    ports:
       # have to be the same as ENV variable PORT
      - 8080:8080
    environment:
      # Path to the SQLite database (must be inside the /data volume above)
      DB_PATH: /data/iptv-proxy.db
      # Port to expose the IPTVs endpoints
      PORT: 8080
      # Hostname or IP to expose the IPTVs endpoints (for machine not for docker)
      HOSTNAME: localhost
      GIN_MODE: release
      # Admin login for the /admin management UI, where xtream-code
      # backends and proxy users are created/edited/deleted.
      ADMIN_USER: admin
      ADMIN_PASSWORD: change-me

